name: Docker Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build \
            -t anupamdb/jd-resume-backend:latest \
            .

      - name: Push backend image
        run: |
          docker push anupamdb/jd-resume-backend:latest

      - name: Build frontend image
        run: |
          docker build \
            -t anupamdb/jd-resume-frontend:v2 \
            ./frontend

      - name: Push frontend image
        run: |
          docker push anupamdb/jd-resume-frontend:v2